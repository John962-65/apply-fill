<!doctype html><meta charset="utf-8"><style>
body{margin:40px;font:14px sans-serif}.record{margin-bottom:45px;width:600px}.atsx-date-picker{position:relative;display:flex;width:600px;height:40px;border:1px solid #aaa;margin:6px 0}.atsx-date-picker-period-month-label{width:300px;height:40px;line-height:40px;padding-left:10px;box-sizing:border-box;cursor:pointer}.atsx-date-picker-period-month-label span{display:inline-block}.atsx-date-picker-period-line{position:absolute;left:300px;height:40px;width:1px;background:#aaa;pointer-events:none}.atsx-date-picker-period-hidden-input{width:0;height:0;border:0;padding:0}.atsx-date-picker-dropdown{position:absolute;background:white;box-shadow:0 2px 4px #888;z-index:20}.atsx-date-picker-period-month-panel{display:flex}.atsx-date-picker-period-month-panel-list{width:80px;height:220px;overflow:auto}.atsx-date-picker-period-month-panel-list-item{height:38px;line-height:38px;text-align:center;cursor:pointer}.atsx-date-picker-panel-header{display:flex;justify-content:space-between}.atsx-date-picker-panel-header-operator{display:block;width:30px;height:30px;cursor:pointer}.atsx-date-picker-panel-body-cell{padding:10px;cursor:pointer}.disabled{opacity:.3}
</style><h3>项目经历</h3><div id="records"></div><h3>获奖</h3><div class="atsx-form-item"><label>获奖时间</label><div class="atsx-date-picker"><input id="award-year" placeholder="YYYY" readonly></div></div>
<script>
const label=()=>'<div class="atsx-date-picker-period-month-label"><span class="atsx-date-picker-period-month-label-year">YYYY</span><span class="atsx-date-picker-period-month-label-separator">-</span><span class="atsx-date-picker-period-month-label-month">MM</span></div>';
for(let i=0;i<2;i++){const r=document.createElement('div');r.className='record';r.innerHTML='<label>项目名称</label><input value="测试项目'+i+'"><div class="atsx-form-item"><label>起止时间</label><div class="atsx-date-picker atsx-date-picker-period-month">'+label()+'<div class="atsx-date-picker-period-line"></div>'+label()+'<input class="atsx-date-picker-period-hidden-input"></div></div>';records.append(r);}
window.actions=[];window.requireTrusted=true;window.mode='normal';let portal,activeRoot,activeIndex,chosenYear;
const allowed=e=>{actions.push({trusted:e.isTrusted,text:e.currentTarget.textContent.trim().slice(0,10)});return !requireTrusted||e.isTrusted;};
function display(root,index,value){const n=root.querySelectorAll('.atsx-date-picker-period-month-label')[index];const [y,m]=value.split('-');n.querySelector('[class$="label-year"]').textContent=y;n.querySelector('[class$="label-month"]').textContent=m;}
function mount(node){if(portal)portal.replaceWith(node);else document.body.append(node);portal=node;}
function renderPeriod(){const anchor=activeRoot.querySelectorAll('.atsx-date-picker-period-month-label')[activeIndex],r=anchor.getBoundingClientRect();const p=document.createElement('div');p.className='atsx-date-picker-dropdown';p.style.left=(r.left+scrollX)+'px';p.style.top=(r.bottom+scrollY+4)+'px';const panel=document.createElement('div');panel.className='atsx-date-picker-period-month-panel';p.append(panel);
 for(let col=0;col<2;col++){const list=document.createElement('div');list.className='scrollbar-container atsx-date-picker-period-month-panel-list ps ps--active-y';panel.append(list);const values=col?Array.from({length:12},(_,i)=>String(i+1).padStart(2,'0')):Array.from({length:27},(_,i)=>String(2026-i));if(mode==='duplicate'&&col===0)values.push('2020');for(const value of values){const item=document.createElement('div');item.className='atsx-date-picker-period-month-panel-list-item';item.textContent=value;list.append(item);item.onclick=e=>{if(!allowed(e))return;if(!col){chosenYear=value;setTimeout(renderPeriod,100);}else{if(!chosenYear)return;if(mode!=='discard')display(activeRoot,mode==='wrong-end'?1-activeIndex:activeIndex,chosenYear+'-'+value);if(mode==='rerender-label'){const old=activeRoot.querySelectorAll('.atsx-date-picker-period-month-label')[activeIndex];const copy=old.cloneNode(true);old.replaceWith(copy);bindLabel(copy,activeRoot,activeIndex);}if(mode==='late-discard')setTimeout(()=>display(activeRoot,activeIndex,'YYYY-MM'),120);if(mode!=='reuse'){portal.remove();portal=null;} }};}}
 mount(p);
}
function bindLabel(n,root,index){n.onclick=e=>{if(!allowed(e))return;document.querySelectorAll('.atsx-date-picker-focus').forEach(n=>n.classList.remove('atsx-date-picker-focus'));activeRoot=root;activeIndex=index;chosenYear=null;root.classList.add('atsx-date-picker-focus');root.querySelector('input').focus();setTimeout(renderPeriod,100);};}
document.querySelectorAll('.atsx-date-picker-period-month').forEach(root=>root.querySelectorAll('.atsx-date-picker-period-month-label').forEach((n,i)=>bindLabel(n,root,i)));
let base=2018;function renderYear(){const r=document.getElementById('award-year').getBoundingClientRect(),p=document.createElement('div');p.className='atsx-date-picker-dropdown';p.style.left=(r.left+scrollX)+'px';p.style.top=(r.bottom+scrollY+4)+'px';p.innerHTML='<div class="atsx-date-picker-panel"><div class="atsx-date-picker-panel-header"><i class="atsx-date-picker-panel-header-operator">‹</i><span class="atsx-date-picker-panel-header-title">'+base+' - '+(base+8)+'</span><i class="atsx-date-picker-panel-header-operator">›</i></div><div class="atsx-date-picker-panel-body atsx-date-picker-panel-body-year"><table><tbody></tbody></table></div></div>';const tb=p.querySelector('tbody');for(let i=0;i<9;i++){if(i%3===0)tb.append(document.createElement('tr'));const td=document.createElement('td');td.className='atsx-date-picker-panel-body-cell';td.innerHTML='<div class="atsx-date-picker-panel-body-cell-wrap"><div class="atsx-date-picker-panel-body-cell-content">'+(base+i)+'</div></div>';tb.lastChild.append(td);td.onclick=e=>{if(!allowed(e))return;document.getElementById('award-year').value=td.textContent;portal.remove();portal=null;};}p.querySelectorAll('i').forEach((n,i)=>n.onclick=e=>{if(!allowed(e))return;base+=i?9:-9;setTimeout(renderYear,100);});mount(p);}
document.getElementById('award-year').onclick=e=>{if(allowed(e))setTimeout(renderYear,100);};
</script>
