<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Anonymous resume autocomplete fixture</title>
<style>
body{margin:36px 90px;font:14px sans-serif}form{max-width:760px}.record{margin:18px 0;padding:12px;border:1px solid #ddd}.form-item{margin:10px 0}label{display:block;margin-bottom:5px}.legacy-select,.opaque{display:inline-block;position:relative;margin-right:8px}input{height:30px;width:190px}.period input{width:92px}ul,.choice-list{position:absolute;z-index:30;top:22px;left:0;min-width:100%;margin:10px 0;padding:0;background:white;box-shadow:0 2px 8px #aaa;list-style:none}li,.choice-item{cursor:pointer;white-space:nowrap;padding:10px}li:hover,.choice-item:hover{background:#eee}[hidden]{display:none!important}.chevron{position:absolute;right:8px;top:8px;pointer-events:none}.period{display:flex;align-items:center}.period .legacy-select{margin-right:8px}
</style>
<form><main><h2>个人信息</h2><div class="form-item"><label for="person-name">姓名</label><input id="person-name"></div>
<h2>教育背景</h2><div id="education"></div><h2>获奖经历</h2><div id="awards"></div>
<h2>自我描述</h2><div class="form-item"><label for="summary">自我评价</label><input id="summary"></div></main>
<button type="submit">提交申请</button></form><div role="listbox" id="unrelated"><div role="option">示例大学</div></div>
<script>
const mode=new URL(location.href).searchParams.get('mode')||'normal';
self.stats={wrong:0,untrusted:0,add:0,submit:0,selected:[],maxOpen:0,replacements:0,hoverReplaced:0,opened:[]};
document.querySelector('form').onsubmit=e=>{e.preventDefault();stats.submit++};
document.getElementById('unrelated').onclick=()=>stats.wrong++;
const years=Array.from({length:36},(_,i)=>String(1995+i)+'年'),months=Array.from({length:12},(_,i)=>(i+1)+'月');
function widget(id,options,{search=false,placeholder='',opaque=false}={}){
 const r=document.createElement('div');r.className=opaque?'opaque':'legacy-select';r.dataset.control=id;
 r.innerHTML='<input type="text" id="'+id+'" placeholder="'+placeholder+'" '+(search?'':'readonly')+'><input type="hidden" name="'+id+'-selected"><span class="chevron">▾</span>';
 let list=null,timer;
 const input=r.querySelector('input'),stored=r.querySelector('[type=hidden]');
 if(mode==='no-token'&&id==='school-1')stored.remove();
 const closed=()=>{list?.remove();list=null;input.setAttribute('aria-expanded','false')};
 const open=()=>{
  if(list)return;
  list=document.createElement(mode==='div-list'?'div':'ul');list.dataset.fixtureMenu='';if(mode==='div-list')list.className='choice-list';r.append(list);input.setAttribute('aria-expanded','true');
  stats.opened.push({id,count:document.querySelectorAll('[data-fixture-menu]').length});stats.maxOpen=Math.max(stats.maxOpen,document.querySelectorAll('[data-fixture-menu]').length);
  const render=()=>{
   if(!list)return;
   let choices=options;
   if(search&&input.value)choices=options.filter(v=>v.includes(input.value));
   if(id==='school-1'&&mode==='no-choice')choices=['示例大学希望学院'];
   if(id==='school-1'&&mode==='duplicate')choices=['示例大学','示例大学'];
   list.replaceChildren(...choices.map((caption,i)=>{
    const li=document.createElement(mode==='div-list'?'div':'li');if(mode==='div-list')li.className='choice-item';li.textContent=caption;
    li.onmousedown=e=>{
     if(!e.isTrusted){stats.untrusted++;return;}
     if(mode==='discard'&&id==='school-1')return;
     input.value=caption;stored.value=id+'-choice-'+i;stats.selected.push({id,caption});
     if(mode!=='blocked'||id!=='school-1')closed();
     if(mode==='no-token'&&id==='school-1')stored.remove();
     if(mode==='late-discard'&&id==='school-1')setTimeout(()=>{input.value='';stored.value=''},100);
     if(mode.includes('rerender')){
      const copy=widget(id,options,{search,placeholder,opaque});copy.querySelector('input').value=caption;copy.querySelector('[type=hidden]').value=stored.value;
      r.replaceWith(copy);stats.replacements++;
     }
    };
    if(mode==='hover-replace'&&id==='school-1')li.onmouseenter=()=>{
     if(stats.hoverReplaced)return;stats.hoverReplaced++;
     const copy=li.cloneNode(true);copy.removeAttribute('data-applyfill-input');copy.onmousedown=li.onmousedown;li.replaceWith(copy);
    };
    return li;
   }));
   if(search){const footer=document.createElement('li');footer.innerHTML='没有找到? <a href="#">添加全称</a>';footer.onclick=e=>{e.preventDefault();stats.add++};list.append(footer);}
  };
  if(search&&input.value)setTimeout(render,180);else render();
 };
 input.onclick=e=>{if(e.isTrusted)open();else stats.untrusted++};
 input.oninput=()=>{clearTimeout(timer);closed();if(input.value)timer=setTimeout(open,140);};
 input.onkeydown=e=>{if(e.key==='Escape'&&e.isTrusted&&(mode!=='blocked'||id!=='school-1'))closed()};
 r.close=closed;r.open=open;
 return r;
}
function item(record,label,id,options,settings){const row=document.createElement('div');row.className='form-item';row.innerHTML='<label for="'+id+'">'+label+'</label>';row.append(widget(id,options,settings));record.append(row);}
function period(record,prefix,point=false){
 const row=document.createElement('div');row.className='form-item';row.innerHTML='<label>'+(point?'获奖时间':'就读时间')+'</label><div class="period"></div>';
 const p=row.lastElementChild;
 for(const edge of point?['point']:['start','end']){if(edge==='end')p.append(document.createTextNode(' - '));p.append(widget(prefix+'-'+edge+'-year',years,{placeholder:'年'}),widget(prefix+'-'+edge+'-month',months,{placeholder:'月'}));}
 record.append(row);
}
for(let n=1;n<=2;n++){
 const r=document.createElement('div');r.className='record';document.getElementById('education').append(r);period(r,'education-'+n);
 item(r,'学校名称','school-'+n,['示例大学','示例大学希望学院','另一大学'],{search:true,opaque:mode.startsWith('dynamic')});
 item(r,'专业名称','major-'+n,n===1?['机械电子工程','机械电子工程技术']:['交通设备与控制工程'],{search:true});
 item(r,'学历','level-'+n,['博士研究生','硕士研究生','本科']);
}
for(let n=1;n<=2;n++){
 const r=document.createElement('div');r.className='record';document.getElementById('awards').append(r);period(r,'award-'+n,true);
 const row=document.createElement('div');row.className='form-item';row.innerHTML='<label for="award-'+n+'-name">奖项名称</label><input id="award-'+n+'-name">';r.append(row);
 item(r,'获奖级别','award-'+n+'-level',['国家级','省市级','院校级']);
}
if(mode==='manual'){const r=document.querySelector('[data-control="school-1"]');r.querySelector('input').value='人工填写的学校';r.querySelector('[type=hidden]').value='manual-school-id';}
if(mode==='preopened'||mode==='manual-query')for(const id of mode==='preopened'?['school-1','major-1','school-2','major-2']:['school-1']){
 const r=document.querySelector('[data-control="'+id+'"]');r.querySelector('input').value=mode==='manual-query'?'待核对学校':id.startsWith('school')?'示例大学':id==='major-1'?'机械电子工程':'交通设备与控制工程';r.open();
}
if(mode==='blocked')document.querySelector('[data-control="school-1"]').open();
stats.maxOpen=0;stats.opened=[];
self.submittedValues=()=>Object.fromEntries(new FormData(document.querySelector('form')));
</script></html>
