<!doctype html><meta charset="utf-8"><title>Captured UD structure reproduction</title>
<!-- DOM classes, nesting, pointer-events, month captions and label-align
     modifiers come from the user's 2026-10-09 control capture. Labels, values
     and event/state behavior are anonymous fixtures, not the private site. -->
<style>
html,body{margin:0;font:16px sans-serif}main{box-sizing:border-box;min-height:100vh;width:100%;padding:24px;background:#eee}
.ud-formily-item{display:flex;gap:12px;margin-bottom:20px;align-items:center}
.ud-formily-item-label{width:120px;min-height:24px}.ud-formily-item-control{width:400px}
input{height:28px;width:190px}.ud__select{width:200px;display:inline-block;background:white;border:1px solid #999}
.ud__select__selector{padding:8px;min-height:24px;position:relative;cursor:pointer}
.ud__select__selector__content{position:relative;min-height:24px}.ud__select__selector__search{position:absolute;inset:0;pointer-events:none}
.ud__select__selector__search__input{width:175px;height:24px;pointer-events:none;opacity:0}
.ud__select__selector__selectItem{min-height:24px}.ud__select__selector-open .ud__select__selector__search,.ud__select__selector-open input{pointer-events:auto;opacity:1}
.ud__select__selector-open .ud__select__selector__selectItem{opacity:.5}.ud__input-group{display:flex;gap:8px}
.ud__select__dropdown,.ud__picker-dropdown{position:fixed;left:330px;top:80px;min-width:240px;background:white;border:1px solid #aaa;z-index:30;padding:8px}
.ud__select__list__item{display:flex;padding:8px;cursor:pointer}.ud__select__list__item__content{flex:1}.ud__select__list__item__check{width:12px}
.ud__picker-panel-header-inner{display:flex;gap:10px;align-items:center}.ud__picker-panel-header-content{margin-right:auto}
.ud__picker-panel-header-btn{cursor:pointer}.ud__picker-panel-header-icon{width:22px;height:22px}
.ud__picker-panel-body-row{display:flex;gap:12px}.ud__picker__cell{width:70px;padding:10px;position:relative;cursor:pointer}
.ud__picker__cell__range__before,.ud__picker__cell__range__after{position:absolute;pointer-events:none}
.ud__picker__cell-interactive-area{padding:8px}.ud__picker__cell__space{width:8px}
.ud__picker-year-panel-cell{width:80px}.ud__picker__cell--disabled{opacity:.5}
</style>
<main id="form"></main>
<script>
const mode=new URL(location.href).searchParams.get('mode')||'normal';
window.stats={untrusted:0,selections:0,dismissed:0,navigations:0,submissions:0,dangerClicks:0};
const field=(label,html)=>`<div class="ud-formily-item ud-formily-item-layout-vertical ud-formily-item-size-large ud-formily-item-feedback-layout-loose ud-formily-item-label-align-left ud-formily-item-control-align-left"><div class="ud-formily-item-label"><span>${label}</span></div><div class="ud-formily-item-control"><div class="ud-formily-item-control-content"><div class="ud-formily-item-control-content-component">${html}</div></div></div></div>`;
const select=(id,items)=>`<div id="${id}" class="ud__select select__45922b" data-options="${items.join('|')}"><div class="ud__select__selector ud__select__selector-lg ud__select__selector-border-normal"><div class="ud__select__selector__content"><div class="ud__select__selector__selectItem"></div><div class="ud__select__selector__search"><input class="ud__select__selector__search__input ud__native-input" type="search" role="combobox" readonly></div></div><div class="ud__select__selector__arrow"></div></div></div>`;
const plain=id=>`<div class="ud__input ud__input--size-lg"><label class="ud__input-input-wrap"><div class="ud__input-input__placeholder__wrapper"><input id="${id}" class="ud__native-input"></div></label></div>`;
document.getElementById('form').innerHTML=field('姓名',plain('name'))
 +field('手机号码',`<span class="ud__input-group ud__input-group--size-md ud__input-group--compact wrapper__5ac24b">${select('prefix',['+86','+33'])}${plain('phone')}</span>`)
 +field('邮箱',plain('email'))+field('性别',select('gender',['男','女','保密']))
 +field('学校名称',`<div id="school-root" class="ud__select"><div class="ud__select__dropdown-open">${plain('school')}</div></div>`)
 +field('学历',select('degree',['本科','硕士研究生']))
 +field('出生日期',`<div class="ud__picker ud__picker--size-lg"><div class="ud__picker-dateInput ud__picker-inputWrapper"><div class="ud__picker-inputWrapper-inner"><input id="birth" class="ud__picker-input ud__native-input" placeholder="YYYY-MM"></div></div></div>`)
 +field('自我评价',plain('summary'))+'<button id="submit" type="submit">提交</button>';
document.getElementById('prefix').querySelector('.ud__select__selector__selectItem').textContent='+86';
document.getElementById('submit').onclick=()=>stats.submissions++;
let active=null;
const accept=e=>{if(!e.isTrusted){stats.untrusted++;return false;}return true;};
function close(){if(!active)return;active.menu.style.display='none';active.trigger?.classList.remove('ud__select__selector-open');active.root?.classList.remove('ud__select--focus');active=null;stats.dismissed++;}
document.addEventListener('mousedown',e=>{if(active&&!active.menu.contains(e.target)&&!active.root.contains(e.target)&&mode!=='sticky')close();});
function open(root,trigger,items){
 if(active?.root===root)return;
 close();let menu=document.getElementById(root.id+'-menu');if(!menu){menu=document.createElement('div');menu.id=root.id+'-menu';menu.className='ud__select__dropdown ud__select__dropdown-placement-bottomLeft';document.body.append(menu);}
 menu.style.display='block';menu.innerHTML='<div><div class="ud__select__list"><div class="ud__select__list__menu"><div class="rc-virtual-list"><div class="rc-virtual-list-holder"><div><div class="rc-virtual-list-holder-inner"></div></div></div></div></div></div></div>';
 for(const value of items){const row=document.createElement('div');row.innerHTML=`<div class="ud__select__list__item"><div class="ud__select__list__item__content"><span><span>${value}</span></span></div><div class="ud__select__list__item__check"></div></div>`;
  row.querySelector('.ud__select__list__item').onclick=e=>{if(!accept(e))return;stats.selections++;if(mode==='discard')return;
   const caption=root.querySelector('.ud__select__selector__selectItem'),input=root.querySelector('input');if(caption)caption.textContent=value;else input.value=value;
   close();};menu.querySelector('.rc-virtual-list-holder-inner').append(row);}
 trigger.classList.add('ud__select__selector-open');root.classList.add('ud__select--focus');active={root,trigger,menu};
 // Escape and synthetic blur do not close this fixture: exercise the real
 // outside pointer route on a dense page whose body has no bare hit point.
}
document.querySelectorAll('.ud__select__selector').forEach(trigger=>{trigger.onclick=e=>{if(accept(e))open(trigger.closest('.ud__select'),trigger,trigger.closest('.ud__select').dataset.options.split('|'));};});
const school=document.getElementById('school');school.oninput=e=>{if(accept(e)&&school.value)open(school.closest('.ud__select'),school,['示例大学']);};
let datePanel=null;
document.getElementById('birth').onclick=e=>{
 if(!accept(e))return;close();datePanel?.remove();const input=e.target,p=document.createElement('div');datePanel=p;
 p.className='ud__picker ud__picker-dropdown ud__picker-placement-bottomLeft';let year=2026,view='month';
 const render=()=>{
  p.innerHTML='<div class="ud__list__box ud__picker__list__box"><div><div><div class="ud__picker-date-panel"><div class="ud__picker-panel-header"><div class="ud__picker-panel-header-inner"><div class="ud__picker-panel-header-content"><span class="ud__picker-panel-header-btn"></span><button type="button" class="ud__picker-panel-header-icon ud__picker-panel-header-collapse"></button></div><button type="button" class="ud__picker-panel-header-icon"></button><button type="button" class="ud__picker-panel-header-icon"></button></div></div><div class="ud__picker-panel-body"><div class="ud__picker-panel-body-content notranslate"></div></div></div></div></div></div>';
  const heading=p.querySelector('.ud__picker-panel-header-btn');heading.textContent=year+' 年';heading.onclick=e=>{if(accept(e)){view='year';render();}};
  const nav=p.querySelectorAll('button.ud__picker-panel-header-icon:not(.ud__picker-panel-header-collapse)');nav.forEach((n,i)=>n.onclick=e=>{if(accept(e)){stats.navigations++;year+=(i?1:-1)*(view==='year'?10:1)*(mode==='reverse-nav'?-1:1);render();}});
  for(let i=0;i<12;i++){
   const number=view==='month'?i+1:Math.floor(year/10)*10-1+i;
   const body=p.querySelector('.ud__picker-panel-body-content');if(i%3===0)body.append(Object.assign(document.createElement('div'),{className:'ud__picker-panel-body-row'}));
   const c=document.createElement('div');c.className='ud__picker__cell ud__picker-'+view+'-panel-cell';
   c.innerHTML=`<div class="ud__picker__cell__range__before"></div><div class="ud__picker__cell__range__after"></div><div class="ud__picker__cell__range"><div class="ud__picker__cell__inner"><div class="ud__picker__cell-interactive-area">${view==='month'?String(number).padStart(2,'0')+'月':number}</div></div></div>`;
   c.onclick=e=>{if(!accept(e))return;if(view==='year'){year=number;view='month';render();return;}stats.selections++;input.value=year+'-'+String(number).padStart(2,'0');if(mode!=='date-discard'){p.remove();datePanel=null;}};
   body.lastChild.append(c);
  }
 };render();document.body.append(p);
 input.onkeydown=e=>{if(e.key==='Escape'){p.remove();datePanel=null;}};
};
</script>
