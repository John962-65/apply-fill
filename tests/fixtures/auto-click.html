<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>自动点击采集 fixture</title>
<style>
  body { font-family: sans-serif; margin: 24px; }
  .row { margin: 0 0 18px; }
  .atsx-select, .atsx-date-picker { display: inline-block; }
  .atsx-select-selector, .atsx-date-picker-period-month-label {
    display: block; width: 220px; height: 30px; line-height: 30px;
    border: 1px solid #999; padding: 0 8px; box-sizing: border-box; background: #fff;
  }
  .test-panel { position: absolute; left: 40px; background: #fff; border: 1px solid #333; z-index: 50; padding: 6px; }
  .plain-panel { position: absolute; left: 40px; background: #fff; border: 1px solid #333; z-index: 50; padding: 6px; }
  /* 容器比 input 宽：点容器正中心落在空白处，只有点 input 才打得开（真实站点上就是这样）。 */
  #plain-date-root { position: relative; display: inline-block; width: 320px; height: 32px; border: 1px solid #999; background: #fff; box-sizing: border-box; }
  #plain-date-input { width: 120px; height: 30px; border: 0; padding: 0 8px; box-sizing: border-box; }
  #plain-date-icon { position: absolute; right: 8px; top: 8px; width: 16px; height: 16px; background: #888; display: block; }
  .atsx-date-picker-period-month-panel { display: flex; gap: 12px; }
  .atsx-date-picker-period-month-panel-list { display: block; height: 90px; overflow: auto; }
  button, label.atsx-select-selection { margin-right: 12px; }
  label.atsx-select-selection { display: inline-block; border: 1px solid #ccc; padding: 4px 8px; }
</style>
</head>
<body>

<!-- 真实站点上的自定义控件：面板只在 isTrusted 的点击下才挂出来 -->
<div class="row">
  <label>学历</label>
  <div class="atsx-select" id="combo-root">
    <div class="atsx-select-selector" id="combo-trigger" role="combobox" aria-expanded="false" aria-controls="combo-list">请选择</div>
  </div>
</div>

<div class="row">
  <label>开始时间</label>
  <div class="atsx-date-picker atsx-date-picker-period-month" id="date-root">
    <span class="atsx-date-picker-period-month-label" id="date-start"><span class="year">YYYY</span><span class="separator">-</span><span class="month">MM</span></span>
    <input id="date-hidden" style="position:absolute;width:0;height:0;opacity:0">
  </div>
</div>

<!-- 复刻真实采集文件里点开不了的那个日期控件：点容器正中心落在空白处，只有点 input 才打得开 -->
<div class="row">
  <label>获奖时间</label>
  <div class="atsx-date-picker" id="plain-date-root">
    <input class="atsx-input atsx-input-lg" id="plain-date-input" placeholder="YYYY" readonly>
    <i class="anticon atsx-date-picker-icon" id="plain-date-icon"></i>
  </div>
</div>

<!-- 长得像控件、点下去却会改数据的四类：必须全部跳过 -->
<div class="row">
  <button type="submit" class="atsx-select-selector" id="danger-submit">提交</button>
  <a href="/next-page" class="ant-picker" id="danger-next">下一步</a>
  <button type="button" class="ant-picker" id="danger-clear">清空</button>
  <label class="atsx-select-selection" id="danger-consent"><input type="checkbox" id="danger-agree">同意协议</label>
</div>

<!-- 用来撞数量预算的多余控件 -->
<div class="row">
  <div class="atsx-select" id="extra-root-1"><div class="atsx-select-selector" id="extra-trigger-1" role="combobox">请选择</div></div>
</div>
<div class="row">
  <div class="atsx-select" id="extra-root-2"><div class="atsx-select-selector" id="extra-trigger-2" role="combobox">请选择</div></div>
</div>
<div class="row">
  <div class="atsx-select" id="extra-root-3"><div class="atsx-select-selector" id="extra-trigger-3" role="combobox">请选择</div></div>
</div>
<div class="row"><div class="atsx-select" id="extra-root-4"><div class="atsx-select-selector" id="extra-trigger-4" role="combobox">请选择</div></div></div>
<div class="row"><div class="atsx-select" id="extra-root-5"><div class="atsx-select-selector" id="extra-trigger-5" role="combobox">请选择</div></div></div>
<div class="row"><div class="atsx-select" id="extra-root-6"><div class="atsx-select-selector" id="extra-trigger-6" role="combobox">请选择</div></div></div>
<div class="row"><div class="atsx-select" id="extra-root-7"><div class="atsx-select-selector" id="extra-trigger-7" role="combobox">请选择</div></div></div>

<script>
  self.danger = { submit: 0, next: 0, clear: 0, consent: 0 };
  self.trustedClicks = [];
  self.untrustedClicks = [];

  const guard = (id, key) => document.getElementById(id).addEventListener('click', (event) => {
    event.preventDefault();
    self.danger[key] += 1;
  });
  guard('danger-submit', 'submit');
  guard('danger-next', 'next');
  guard('danger-clear', 'clear');
  guard('danger-consent', 'consent');
  document.getElementById('danger-agree').addEventListener('change', () => { self.danger.consent += 1; });

  const closePanels = () => document.querySelectorAll('.test-panel').forEach((panel) => panel.remove());

  // 只认真实点击：合成事件不打开面板，这正是 0.8.0 引入 CDP 输入的原因。
  const trustedOnly = (trigger, build) => {
    trigger.addEventListener('pointerdown', (event) => {
      if (!event.isTrusted) return;
      setTimeout(() => {
        closePanels();
        document.body.append(build());
        trigger.setAttribute('aria-expanded', 'true');
      }, 100);
    });
  };

  // 记账统一放在 document 捕获阶段：CDP 点击的事件目标是控件内部的触发器，
  // 合成点击的事件目标是驱动拿到的容器本身（事件只向上冒泡，装在子节点上收不到），
  // 两者都要归到同一个控件 id，测试才能比较两条路径点了哪些控件。
  const WIDGETS = '#combo-root,#date-root,#plain-date-root,'+[1,2,3,4,5,6,7].map(i=>'#extra-root-'+i).join(',');
  const widgetOf = (node) => node?.closest?.(WIDGETS)?.id || null;
  document.addEventListener('pointerdown', (event) => {
    const widget = widgetOf(event.target);
    if (widget && event.isTrusted) self.trustedClicks.push(widget);
  }, true);
  document.addEventListener('mousedown', (event) => {
    const widget = widgetOf(event.target);
    if (widget && !event.isTrusted) self.untrustedClicks.push(widget);
  }, true);

  trustedOnly(document.getElementById('combo-trigger'), () => {
    const panel = document.createElement('div');
    panel.className = 'atsx-select-dropdown test-panel';
    panel.id = 'combo-list';
    panel.setAttribute('role', 'listbox');
    panel.innerHTML = '<div role="option" class="atsx-select-item-option">本科</div>'
      + '<div role="option" class="atsx-select-item-option">UNIQUE-COMBO-OPTION</div>';
    return panel;
  });

  trustedOnly(document.getElementById('date-start'), () => {
    const panel = document.createElement('div');
    panel.className = 'atsx-date-picker-dropdown test-panel';
    panel.innerHTML = '<div class="atsx-date-picker-period-month-panel">'
      + '<div class="atsx-date-picker-period-month-panel-list"><span>2020</span><span>UNIQUE-DATE-YEAR</span></div>'
      + '<div class="atsx-date-picker-period-month-panel-list"><span>01</span><span>02</span></div></div>';
    return panel;
  });

  // 获奖时间：只认 input 上的真实点击，而且只认失焦关闭（Escape、点外面都关不掉），
  // 用来验证驱动点的是 input 而不是容器、以及关弹层补上了 blur。
  const plainInput = document.getElementById('plain-date-input');
  plainInput.addEventListener('pointerdown', (event) => {
    if (!event.isTrusted) return;
    setTimeout(() => {
      closePanels();
      const panel = document.createElement('div');
      panel.className = 'atsx-date-picker-dropdown plain-panel';
      panel.innerHTML = '<div class="atsx-date-picker-panel-body-year"><span>UNIQUE-PLAIN-DATE</span><span>2020</span></div>';
      document.body.append(panel);
    }, 100);
  });
  plainInput.addEventListener('blur', () => document.querySelectorAll('.plain-panel').forEach((panel) => panel.remove()));

  for (const index of [1, 2, 3, 4, 5, 6, 7]) {
    trustedOnly(document.getElementById(`extra-trigger-${index}`), () => {
      const panel = document.createElement('div');
      panel.className = 'atsx-select-dropdown test-panel';
      panel.setAttribute('role', 'listbox');
      panel.innerHTML = `<div role="option" class="atsx-select-item-option">UNIQUE-EXTRA-${index}</div>`;
      return panel;
    });
  }

  // Escape 与「点外面」都要能关掉面板：驱动关不掉时会记 panel-stuck。
  document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closePanels(); });
  document.addEventListener('mousedown', (event) => { if (event.target === document.body) closePanels(); });
</script>
</body>
</html>
