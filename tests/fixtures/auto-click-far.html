<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>自动点击采集：长表单滚动 fixture</title>
<style>
  /* 平滑滚动会放大「滚动没停稳就把坐标交给 CDP」的问题：真实站点上目标常在几千像素之下。 */
  html { scroll-behavior: smooth; }
  body { font-family: sans-serif; margin: 24px; }
  .spacer { height: 4000px; }
  .atsx-select { display: inline-block; }
  .atsx-select-selector {
    display: block; width: 220px; height: 30px; line-height: 30px;
    border: 1px solid #999; padding: 0 8px; box-sizing: border-box; background: #fff;
  }
  .test-panel { position: absolute; left: 40px; background: #fff; border: 1px solid #333; z-index: 50; padding: 6px; }
</style>
</head>
<body>
<div class="spacer">长表单占位：真实网申页动辄几千像素，目标控件远在首屏之下。</div>

<div class="row">
  <label>期望薪资</label>
  <div class="atsx-select" id="far-root">
    <div class="atsx-select-selector" id="far-trigger" role="combobox">请选择</div>
  </div>
</div>

<script>
  self.trustedClicks = [];
  document.addEventListener('pointerdown', (event) => {
    const widget = event.target?.closest?.('#far-root')?.id;
    if (widget && event.isTrusted) self.trustedClicks.push(widget);
  }, true);

  document.getElementById('far-trigger').addEventListener('pointerdown', (event) => {
    if (!event.isTrusted) return;
    setTimeout(() => {
      closePanels();
      const panel = document.createElement('div');
      panel.className = 'atsx-select-dropdown test-panel';
      panel.setAttribute('role', 'listbox');
      panel.innerHTML = '<div role="option" class="atsx-select-item-option">UNIQUE-FAR-OPTION</div>';
      document.body.append(panel);
    }, 100);
  });

  function closePanels() {
    document.querySelectorAll('.test-panel').forEach((panel) => panel.remove());
  }
  document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closePanels(); });
</script>
</body>
</html>
