<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Split resume regression</title>
<style>body{font:14px sans-serif}main{width:780px}.block{margin:24px}.record{padding:12px;border:1px solid #ccc;margin:8px}.form-item{display:flex;gap:12px;margin:8px}label{width:105px;flex-shrink:0}.period,.endpoint{display:flex;gap:6px}select{min-width:80px}textarea{width:480px;height:44px}input{width:280px}.section-links{position:fixed;right:10px;top:10px}</style></head><body>
<!-- Plain div navigation must not become a section heading for the main form. -->
<div class="section-links"><div>个人信息</div><div>求职意向</div><div>工作经历</div><div>教育背景</div><div>实习经验</div><div>项目经验</div><div>语言能力</div><div>自我描述</div><div>获奖经历</div></div>
<main id="form"></main>
<script>
const text=(id,label,type='input')=>`<div class="form-item"><label for="${id}">${label}</label><${type} id="${id}"></${type}></div>`;
const select=(id,label,options)=>`<div class="form-item"><label for="${id}">${label}</label><select id="${id}"><option value="">请选择</option>${options.map((caption,index)=>`<option value="code-${index}">${caption}</option>`).join('')}</select></div>`;
const part=(id,type)=>`<div class="date-part"><select id="${id}"><option value="">${type==='year'?'年':'月'}</option>${(type==='year'?Array.from({length:31},(_,i)=>2000+i):Array.from({length:12},(_,i)=>i+1)).map(number=>`<option value="encoded-${number}">${number}${type==='year'?'年':'月'}</option>`).join('')}</select></div>`;
const endpoint=(id)=>`<div class="endpoint">${part(id+'-year','year')}${part(id+'-month','month')}</div>`;
const period=(id,label)=>`<div class="form-item"><label>${label}</label><div class="period">${endpoint(id+'-a')}<span>至</span>${endpoint(id+'-b')}</div></div>`;
const checkbox=(id)=>`<div class="form-item"><label for="${id}">至今</label><input id="${id}" type="checkbox"></div>`;
const record=(id,content)=>`<div class="record" data-record="${id}">${content}</div>`;
const block=(heading,content)=>`<div class="block"><div><span>${heading}</span></div><div>${content}</div></div>`;
document.getElementById('form').innerHTML=
block('个人信息',select('gender','性别',['男','女'])+text('experience','工作经验')+select('highest','最高学历',['本科','硕士'])+text('address','所在地')+text('recent','最近公司')+text('identity-a','身份证')+text('identity-b','身份证')+text('birth','出生日期 (年龄)')+text('salary','当前薪资')+text('desired-salary','期望薪资')+text('city','期望城市'))+
block('求职意向','')+block('工作经历','')+
block('教育背景',[1,2].map(n=>record('education-'+n,period('education-'+n,'就读时间')+text('school-'+n,'学校名称')+text('major-'+n,'专业名称')+select('education-'+n+'-level','学历',['本科','硕士']))).join(''))+
block('实习经验','')+
block('项目经验',Array.from({length:7},(_,i)=>{const n=i+1;return record('project-'+n,period('project-'+n,'起止时间')+checkbox('ongoing-'+n)+text('project-'+n+'-name','项目名称')+text('project-'+n+'-role','职责')+text('project-'+n+'-overview','项目描述','textarea')+text('project-'+n+'-duties','项目中职责','textarea'));}).join(''))+
block('语言能力',select('language','语言类型',['英语','日语'])+select('proficiency','掌握程度',['熟练','精通'])+select('listening','听说',['良好','一般'])+select('reading','读写',['良好','一般']))+
block('自我描述',text('summary','自我描述','textarea'))+
block('获奖经历',Array.from({length:5},(_,i)=>{const n=i+1;return record('award-'+n,`<div class="form-item"><label>获奖时间</label>${endpoint('award-'+n)}</div>`+text('award-'+n+'-name','奖项名称'));}).join(''));
self.replacements=0;
// Match the reported hashed sd-Select shells and split-date layout, using anonymous
// state. This is a regression fixture, not a copy of a signed-in website's DOM.
const mode=new URL(location.href).searchParams.get('mode')||'';
if(mode.startsWith('sd-')){
 const sibling=mode.startsWith('sd-sibling');
 const css=document.createElement('style');css.textContent=`
 [class*="sd-Dropdown-container"]{display:inline-block;position:relative;min-width:110px}
 [class*="sd-Select-container"]{display:flex;align-items:center;position:relative;min-height:32px;border:1px solid #aaa}
 [class*="sd-Select-container"] input{width:100px;border:0}
 .caption{position:absolute;left:5px;pointer-events:none;background:white}
 .sd-choice-list,.floating-a91{position:absolute;z-index:40;top:32px;left:0;background:white;min-width:150px;max-height:220px;overflow:auto;box-shadow:0 1px 5px #888}
 .sd-choice-item,.row-b72{padding:8px;cursor:pointer}.sd-choice-item:hover,.row-b72:hover{background:#ddd}
 [hidden]{display:none!important}`;document.head.append(css);
 self.sdStats={untrusted:0,selected:0};self.sdChosen={};
 function widget(id,choices,placeholder='',search=false){
  const wrap=document.createElement('div');wrap.className='sd-Dropdown-container-1CigZ';
  wrap.innerHTML=`<label class="sd-Input-container-2S_vM sd-Select-container-1Eq4x"><input id="${id}" type="text" placeholder="${placeholder}" ${search?'':'readonly'}><span class="caption"></span><span class="chevron" aria-hidden="true">▾</span></label>`;
  const shell=wrap.firstElementChild,input=shell.querySelector('input'),caption=shell.querySelector('.caption');
  let list=null;
  const close=()=>{list?.remove();list=null;if(!sibling)input.setAttribute('aria-expanded','false')};
  const open=()=>{
   if(list)return;list=document.createElement('div');list.className=sibling?'floating-a91':'sd-choice-list';if(!sibling){list.setAttribute('role','listbox');input.setAttribute('aria-expanded','true');}wrap.append(list);
   const captions=search?input.value?choices.filter(c=>c.includes(input.value)):[]:choices;
   list.replaceChildren(...captions.map(text=>{const item=document.createElement('div');item.className=sibling?'row-b72':'sd-choice-item';if(!sibling)item.setAttribute('role','option');item.textContent=text;
    item.onmousedown=e=>{
     if(!e.isTrusted){sdStats.untrusted++;return;}
     if(mode==='sd-discard'&&id==='education-1-a-year')return;
     if(mode==='sd-sibling-reject')return;
     if(mode==='sd-sibling-sticky'){caption.textContent=text;return;}
     sdChosen[id]=text;sdStats.selected++;close();
     if(mode==='sd-input'){input.value=text;caption.textContent='';}
     else{input.value='';caption.textContent=text;}
     if(mode==='sd-late-discard'&&id==='education-1-a-year')setTimeout(()=>{caption.textContent='';delete sdChosen[id]},100);
     if(mode==='sd-rerender'){
      const fresh=widget(id,choices,placeholder,search);fresh.querySelector('.caption').textContent=text;shell.parentElement.replaceWith(fresh);replacements++;
     }
    };return item;}));
  };
  shell.onclick=e=>{if(e.isTrusted)open();else sdStats.untrusted++};
  input.oninput=()=>{if(sibling)caption.textContent=input.value;close();setTimeout(open,100)};
  input.onkeydown=e=>{if(e.key==='Escape'&&e.isTrusted)close()};
  return wrap;
 }
 document.querySelectorAll('main select').forEach(select=>{
  const isYear=select.id.endsWith('year'),choices=isYear?Array.from({length:201},(_,i)=>String(1900+i)+'年'):Array.from(select.options).slice(1).map(o=>o.textContent);
  select.replaceWith(widget(select.id,choices,select.options[0].textContent,sibling));
 });
 document.querySelectorAll('main input[id^="school-"],main input[id^="major-"]').forEach(input=>{
  const choices=input.id.startsWith('school')?['示例大学','示例大学希望学院']:input.id.endsWith('1')?['机械工程','机械工程技术']:['控制工程'];
  input.replaceWith(widget(input.id,choices,'请选择',true));
 });
 document.querySelectorAll('.period > span').forEach(span=>span.replaceWith(document.createTextNode(' - ')));
 // A field named “工作经验” must not become a section named “工作经历”.
 document.querySelector('#experience').parentElement.className='apply-field-abc';
 const label=document.querySelector('#experience').previousElementSibling,title=document.createElement('div');title.className='title-a1b2';title.textContent=label.textContent;label.replaceWith(title);
}
document.addEventListener('change',event=>{
 if(!self.rerender)return;
 const old=event.target.closest('.record');if(!old)return;
 const values=Array.from(old.querySelectorAll('input,textarea,select'),node=>({id:node.id,value:node.value,checked:node.checked}));
 const fresh=old.cloneNode(true);for(const value of values){const node=fresh.querySelector('#'+value.id);node.value=value.value;if(node.type==='checkbox')node.checked=value.checked;}
 old.replaceWith(fresh);self.replacements++;
});
</script></body></html>
